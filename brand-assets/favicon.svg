<!-- Canonical Upway favicon — v2.2 paper-plane mark (Design Kernel v2.0).
     Single source of truth — drop this exact file into every consumer's public/favicon.svg.
     Subset of @upway/ui UpwayMark + UpwayIcon (forest-deep squircle + Volt tip facet). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lit" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#2D6B47"/>
      <stop offset="100%" stop-color="#A7D9B6"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#1A4D32"/>
      <stop offset="100%" stop-color="#3A7A53"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0%" stop-color="rgba(143,191,160,0.45)"/>
      <stop offset="100%" stop-color="rgba(143,191,160,0)"/>
    </radialGradient>
  </defs>
  <!-- Forest-deep squircle background -->
  <rect width="32" height="32" rx="7" fill="#0D2E1D"/>
  <!-- Sage ambient glow top-left -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- The v2.2 plane, scaled into 32x32 with safe margins -->
  <g transform="translate(4, 4) scale(1)">
    <!-- Left (lit) facet -->
    <path d="M12 2.5 L3.5 19 L12 15.5 Z" fill="url(#lit)"/>
    <!-- Right (shadow) facet -->
    <path d="M12 2.5 L20.5 19 L12 15.5 Z" fill="url(#sh)"/>
    <!-- Specular sheen on lit facet -->
    <path d="M12 3.4 L7.6 12.8 L11.1 12.4 Z" fill="#FFFFFF" opacity="0.18"/>
    <!-- Volt tip — the nose IS the event -->
    <path d="M12 2.5 L9.8 6 L14.2 6 Z" fill="#C6FF3D"/>
  </g>
</svg>
